name: API Health Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: api-health-monitor
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: staging
            api_url: https://api-staging-f955.up.railway.app
          - name: production
            api_url: https://api.tutorsnapai.tech

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify API contract
        id: verify
        continue-on-error: true
        env:
          API_BASE_URL: ${{ matrix.api_url }}
          VERIFY_TIMEOUT_MS: "90000"
          VERIFY_POLL_INTERVAL_MS: "5000"
        run: node scripts/verify-deployment.mjs

      - name: Open or update outage issue
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          TARGET_NAME: ${{ matrix.name }}
          TARGET_URL: ${{ matrix.api_url }}
        with:
          script: |
            const title = `[Operations] ${process.env.TARGET_NAME} API health check failed`;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            const body = [
              `TutorSnap's **${process.env.TARGET_NAME}** API contract check failed.`,
              '',
              `Endpoint: ${process.env.TARGET_URL}`,
              `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'Check Railway deployment status, migration logs, `/api/ready`, and the most recent successful deployment before rolling back.',
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Close recovered outage issue
        if: steps.verify.outcome == 'success'
        uses: actions/github-script@v7
        env:
          TARGET_NAME: ${{ matrix.name }}
        with:
          script: |
            const title = `[Operations] ${process.env.TARGET_NAME} API health check failed`;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Health recovered in ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail unhealthy target
        if: steps.verify.outcome == 'failure'
        run: exit 1
