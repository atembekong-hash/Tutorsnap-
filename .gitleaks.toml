title = "TutorSnap Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "gcp-api-key"

  [[rules.allowlists]]
  description = "Firebase Android client configuration is public application metadata embedded in the APK."
  paths = ['''(^|/)google-services\.json$''']

[[rules]]
id = "curl-auth-header"

  [[rules.allowlists]]
  description = "RevenueCat documentation uses an explicit non-secret placeholder."
  condition = "AND"
  regexTarget = "line"
  regexes = ['''Authorization:\s+YOUR_SECRET_HERE''']
  paths = ['''(^|/)REVENUECAT_SETUP\.md$''']

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Firebase Android client configuration is public application metadata embedded in the APK."
  paths = ['''(^|/)google-services\.json$''']

  [[rules.allowlists]]
  description = "RevenueCat unit tests use synthetic SDK keys that cannot authenticate to the service."
  condition = "AND"
  regexTarget = "line"
  regexes = ['''EXPO_PUBLIC_REVENUECAT_APPLE_KEY\s*=\s*"appl_test_key_[0-9]+"''']
  paths = ['''(^|/)tests/(subscription-hardening|rc-identity)\.test\.ts$''']
